name: Build, Scan and Publish Docker image

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # Checkout du repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login au GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build de l’image Docker
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/q240094/ue19-lab-05:latest .

      # 🔍 Scan Trivy avant publication
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: "ghcr.io/q240094/ue19-lab-05:latest"
          format: table
          ignore-unfixed: true
          vuln-type: "os,library"

      # Push si scan OK
      - name: Push Docker image
        run: |
          docker push ghcr.io/q240094/ue19-lab-05:latest
